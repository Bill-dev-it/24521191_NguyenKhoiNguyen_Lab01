
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Aviation Parts — Loading</title>

    <link rel="stylesheet" href="skeleton.css">
</head>

<body>
    <header>
        <h1>Aviation B2B E-Commerce Platform</h1>
        <p>Aircraft Parts Marketplace</p>
    </header>

    <main id="main-content">
        <section aria-labelledby="parts-heading"
                 aria-busy="true">

            <h2 id="parts-heading">
                Available Aircraft Parts
            </h2>

            <p role="status">
                Loading aircraft parts...
            </p>

            <ul class="skeleton-list"
                aria-hidden="true">

                <li class="skeleton-item"></li>
                <li class="skeleton-item"></li>
                <li class="skeleton-item"></li>
                <li class="skeleton-item"></li>

            </ul>
        </section>
    </main>
</body>
</html>
